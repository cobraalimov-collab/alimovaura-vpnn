name: nodeshield_vpn
description: Decentralized-style WireGuard VPN client for Android (Flutter).
publish_to: 'none'
version: 1.0.0+1   # <- versionCode (after '+') MUST increase on every Play Store upload

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- VPN engine (WireGuard) -------------------------------------------------
  # Wraps the official wireguard-android tunnel library (GoBackend).
  # Check https://pub.dev/packages/wireguard_flutter for the newest version and
  # compare its README with lib/vpn_engine.dart if `flutter analyze` complains.
  wireguard_flutter: ^0.1.3

  # --- Networking / API ------------------------------------------------------
  dio: ^5.4.3

  # --- State management ------------------------------------------------------
  flutter_riverpod: ^2.5.1

  # --- Secure storage (auth token + WireGuard private key) -------------------
  flutter_secure_storage: ^9.2.2

  # --- Pure-Dart X25519 so the WireGuard private key is generated ON DEVICE --
  cryptography: ^2.7.0

  # --- Runtime notification permission (Android 13+) -------------------------
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
